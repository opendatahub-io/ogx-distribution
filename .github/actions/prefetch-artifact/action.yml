name: Prefetch model/data OCI artifact
description: >-
  Restore the OGX model/data OCI artifact into the build context
  (distribution/artifact-cache/.cache) via actions/cache, keeping the cache warm
  so fork PRs (which build in cache mode) can restore it. On a cache miss, pull
  it with oras when a stage-registry token is available; without a token
  (fork/Dependabot PRs) nothing is staged, so a fork build with a cold cache
  fails in its cache step.

inputs:
  artifact-image:
    description: OCI artifact reference to pull
    required: false
    default: registry.stage.redhat.io/rhai/redhatai-ogx-distribution:3.0
  registry-user:
    description: Stage-registry username
    required: false
    default: agentic-api
  registry-token:
    description: Stage-registry token (empty on fork/Dependabot PRs)
    required: false
    default: ''
  oras-version:
    description: oras CLI version to use for the fallback pull
    required: false
    default: '1.2.3'
  working-directory:
    description: Directory containing the checked-out repo
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Restore artifact cache
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.working-directory }}/distribution/artifact-cache/.cache
        key: oras-artifact-${{ inputs.artifact-image }}

    - name: Pull artifact on cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ORAS_TOKEN: ${{ inputs.registry-token }}
        ARTIFACT_IMAGE: ${{ inputs.artifact-image }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        ORAS_VERSION: ${{ inputs.oras-version }}
      run: |
        set -euo pipefail
        if [ -z "${ORAS_TOKEN}" ]; then
          echo "::notice::No stage-registry token (fork/Dependabot PR?); cannot populate cache. A fork build relies on the cache restored from the base branch."
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) ARCH=amd64 ;;
          aarch64 | arm64) ARCH=arm64 ;;
          *) echo "::error::Unsupported runner arch $(uname -m)"; exit 1 ;;
        esac
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" \
          | tar -xz -C "${tmp}" oras
        mkdir -p distribution/artifact-cache/.cache
        printf '%s' "${ORAS_TOKEN}" | "${tmp}/oras" pull "${ARTIFACT_IMAGE}" \
          --username "${REGISTRY_USER}" --password-stdin \
          --output distribution/artifact-cache/.cache
        rm -f distribution/artifact-cache/.cache/README.md
        echo "Prefetched artifact into distribution/artifact-cache/.cache"
